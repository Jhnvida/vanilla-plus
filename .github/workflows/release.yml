name: Build & Release Mod

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    name: Build and Publish Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Mod with Gradle
        run: ./gradlew build --no-daemon

      - name: Locate Release Jar
        id: locate_jar
        run: |
          JAR_FILE=$(find build/libs -maxdepth 1 -type f -name "*.jar" ! -name "*-dev.jar" ! -name "*-sources.jar" ! -name "*-javadoc.jar" | head -n 1)
          if [ -z "$JAR_FILE" ] || [ ! -f "$JAR_FILE" ]; then
            echo "::error::Nenhum arquivo .jar de release foi encontrado em build/libs/!"
            exit 1
          fi
          echo "Found release jar: $JAR_FILE"
          echo "jar_file=$JAR_FILE" >> $GITHUB_OUTPUT

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.locate_jar.outputs.jar_file }}
          name: VanillaPlus ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            ## VanillaPlus ${{ github.ref_name }}

            ### 📌 Requisitos de Instalação (Minecraft 26.3):
            - **[Fabric Loader](https://fabricmc.net/use/installer/)** (>= 0.19.5)
            - **Java 25** ou superior
            - **[Fabric API](https://modrinth.com/mod/fabric-api)** (Obrigatório)
            - **[Cloth Config API](https://modrinth.com/mod/cloth-config)** (Obrigatório para a tela de configurações)
            - **[Mod Menu](https://modrinth.com/mod/modmenu)** (Opcional, recomendado para acessar opções no menu)

            ---
            ### 🚀 Como Instalar:
            1. Certifique-se de que o **Fabric Loader**, **Fabric API** e **Cloth Config API** estão instalados na sua pasta `.minecraft/mods/`.
            2. Baixe o arquivo `.jar` anexado abaixo e coloque-o na mesma pasta `.minecraft/mods/`.
            3. Inicie o jogo pelo perfil Fabric!
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
