name: Build & Release Mod

on:
    push:
        tags:
            - "v*"
    workflow_dispatch:

jobs:
    release:
        name: Build and Publish Release
        runs-on: ubuntu-latest
        permissions:
            contents: write

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Set up JDK 25
              uses: actions/setup-java@v4
              with:
                  java-version: "25"
                  distribution: "temurin"
                  cache: "gradle"

            - name: Grant execute permission for gradlew
              run: chmod +x gradlew

            - name: Build Mod with Gradle
              run: ./gradlew build --no-daemon

            - name: Locate Release Jar
              id: locate_jar
              run: |
                  JAR_FILE=$(find build/libs -maxdepth 1 -type f -name "*.jar" ! -name "*-dev.jar" ! -name "*-sources.jar" ! -name "*-javadoc.jar" | head -n 1)
                  if [ -z "$JAR_FILE" ] || [ ! -f "$JAR_FILE" ]; then
                    echo "::error::Nenhum arquivo .jar de release foi encontrado em build/libs/!"
                    exit 1
                  fi
                  echo "Found release jar: $JAR_FILE"
                  echo "jar_file=$JAR_FILE" >> $GITHUB_OUTPUT

            - name: Publish GitHub Release
              uses: softprops/action-gh-release@v2
              with:
                  files: ${{ steps.locate_jar.outputs.jar_file }}
                  name: VanillaPlus ${{ github.ref_name }}
                  generate_release_notes: true
                  body: |
                      ### Pré-requisitos e Compatibilidade

                      | Componente | Versão Suportada | Tipo |
                      | :--- | :--- | :--- |
                      | **Minecraft** | `26.3` | Jogo Base |
                      | **Fabric Loader** | `>= 0.19.5` | Carregador de Mod |
                      | **Fabric API** | Compatível com 26.3 | Biblioteca Obrigatória |
                      | **Cloth Config API** | `>= 26.3.158` | Biblioteca Obrigatória |
                      | **Java Runtime** | `>= 25` | Ambiente de Execução |
                      | **ModMenu** | `>= 21.0.0` | Opcional (Menu in-game) |

                      ---

                      ### Procedimento de Instalação

                      1. Faça o download do arquivo `.jar` disponível abaixo na seção **Assets**.
                      2. Certifique-se de que o **Fabric Loader**, **Fabric API** e **Cloth Config API** estejam instalados no seu inicializador.
                      3. Mova o arquivo binário `.jar` para o diretório `.minecraft/mods/`.
                      4. Inicie o jogo selecionando o perfil do Fabric.

                      > [!NOTE]
                      > Este mod opera exclusivamente no lado do cliente (*client-side*). Nenhuma modificação é necessária no servidor.

              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
